<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
  <!-- Classic layout wireframe -->
  <rect width="160" height="100" rx="4" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <!-- Menu bar -->
  <rect x="2" y="2" width="156" height="12" rx="2" fill="#e0e0e0"/>
  <!-- Toolbar row 1 -->
  <rect x="2" y="16" width="156" height="12" rx="2" fill="#e8e8e8"/>
  <!-- Toolbar row 2 -->
  <rect x="2" y="30" width="156" height="12" rx="2" fill="#e8e8e8"/>
  <!-- Viewport (larger, no sidebar) -->
  <rect x="2" y="44" width="156" height="54" rx="2" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
</svg>
