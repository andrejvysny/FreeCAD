<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Light blue circle background -->
  <circle cx="32" cy="32" r="28" fill="#418FDE" opacity="0.12"/>
  <!-- Sparkle/asterisk glyph -->
  <g transform="translate(32,32)" stroke="#418FDE" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Vertical line -->
    <line x1="0" y1="-14" x2="0" y2="14"/>
    <!-- Horizontal line -->
    <line x1="-14" y1="0" x2="14" y2="0"/>
    <!-- Diagonal lines -->
    <line x1="-10" y1="-10" x2="10" y2="10"/>
    <line x1="10" y1="-10" x2="-10" y2="10"/>
  </g>
  <!-- Small circles at endpoints for sparkle effect -->
  <g fill="#418FDE">
    <circle cx="32" cy="18" r="2"/>
    <circle cx="32" cy="46" r="2"/>
    <circle cx="18" cy="32" r="2"/>
    <circle cx="46" cy="32" r="2"/>
    <circle cx="22" cy="22" r="1.5"/>
    <circle cx="42" cy="42" r="1.5"/>
    <circle cx="42" cy="22" r="1.5"/>
    <circle cx="22" cy="42" r="1.5"/>
  </g>
</svg>
