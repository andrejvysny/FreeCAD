<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Touchpad body -->
  <rect x="8" y="12" width="48" height="40" rx="6" fill="none" stroke="#888" stroke-width="2"/>
  <!-- Touchpad surface hint -->
  <rect x="16" y="18" width="32" height="24" rx="3" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  <!-- Two-finger gesture dots -->
